# ---------------------------------------------------------------------
# Content levels. VNDB has no single "content rating" field, so each level
# is a bundle of tags. Tune these to taste:
#   all:          every tag required
#   any:          at least one of these tags
#   exclude_tags: none of these tags
# ---------------------------------------------------------------------
content_levels:
  # Teasing / implied but not explicit. A VN needs at least ONE of these.
  # Add "Sexual Content" to `any` if you also want full eroge included.
  suggestive:
    any:
      - "Sexual Innuendo"            # g1274
      - "Panchira"                   # g1378
      - "Non-explicit Nudity Only"   # g3194
      - "Low Sexual Content"         # g236
    ln: { any: ["Ecchi"] }           # light novels: AniList's Ecchi genre

  # Full sexual content (eroge).
  explicit:
    all:
      - "Sexual Content"             # g23
    ln: { all: ["Hentai"] }

  # Uses VNDB's "No Sexual Content" tag (~15k VNs). For an even stricter
  # filter, add  exclude_tags: ["Sexual Content"]
  all_ages:
    all:
      - "No Sexual Content"          # g235
    ln: { exclude_tags: ["Ecchi", "Hentai"] }

# ---------------------------------------------------------------------
# patterns: regular expressions (case-insensitive, matched as whole words
# anywhere in a clause) for paraphrases a fixed phrase can't cover.
# Same targets as `phrases`. Use single quotes so backslashes survive.
# ---------------------------------------------------------------------
patterns:
  - pattern: '(?:los(?:e|es|t|ing)|forg[eo]t(?:s|ten)?)\s+(?:(?:his|her|their|my|your|all|of)\s+)*memor(?:y|ies)'
    tag: "Amnesia"
  - pattern: '(?:main\s+character|protagonist|protag|main\s+lead|lead|mc|hero)(?:\s+(?:is|being|should\s+be|must\s+be|would\s+be|has\s+to\s+be))?(?:\s+an?)?\s+(?:girl|woman|female|lady|gal)'
    tag: "Female Protagonist"
  - pattern: '(?:play(?:ing)?|playing)\s+as\s+(?:an?\s+)?(?:girl|woman|female|lady)'
    tag: "Female Protagonist"
  - pattern: '(?:girl|woman|female)\s+(?:main\s+character|protagonist|protag|lead|mc)'
    tag: "Female Protagonist"
  - pattern: '(?:main\s+character|protagonist|protag|main\s+lead|lead|mc)(?:\s+(?:is|being|should\s+be|must\s+be|would\s+be|has\s+to\s+be))?(?:\s+an?)?\s+(?:boy|man|male|guy)'
    tag: "Male Protagonist"
  - pattern: '(?:play(?:ing)?)\s+as\s+(?:an?\s+)?(?:boy|man|male|guy)'
    tag: "Male Protagonist"
  - pattern: '(?:boy|man|male|guy)\s+(?:main\s+character|protagonist|protag|lead|mc)'
    tag: "Male Protagonist"
  - pattern: '(?:lots\s+of|many|several|different|multiple)\s+(?:possible\s+)?(?:endings|outcomes)'
    tag: "Multiple Endings"


  suggestive:
    any:
      - "Sexual Innuendo"            # g1274
      - "Panchira"                   # g1378
      - "Non-explicit Nudity Only"   # g3194
      - "Low Sexual Content"         # g236
    ln: { any: ["Ecchi"] }           # light novels: AniList's Ecchi genre

  # Full sexual content (eroge).
  explicit:
    all:
      - "Sexual Content"             # g23
    ln: { all: ["Hentai"] }

  # Uses VNDB's "No Sexual Content" tag (~15k VNs). For an even stricter
  # filter, add  exclude_tags: ["Sexual Content"]
  all_ages:
    all:
      - "No Sexual Content"          # g235
    ln: { exclude_tags: ["Ecchi", "Hentai"] }

# ---------------------------------------------------------------------
# patterns: regular expressions (case-insensitive, matched as whole words
# anywhere in a clause) for paraphrases a fixed phrase can't cover.
# Same targets as `phrases`. Use single quotes so backslashes survive.
# ---------------------------------------------------------------------
patterns:
  - pattern: '(?:historical|feudal|old|ancient)\s+(?:setting\s+)?(?:in\s+)?japan|japanese\s+history'
    tag: "Past Japan"
    ln: "Historical"
  - pattern: '(?:los(?:e|es|t|ing)|forg[eo]t(?:s|ten)?)\s+(?:(?:his|her|their|my|your|all|of)\s+)*memor(?:y|ies)'
    tag: "Amnesia"
  # "strong female protagonist" before the plain female-lead patterns eat "female protagonist"
  - pattern: 'strong\s+(?:female|girl|woman)\s+(?:main\s+character|protagonist|protag|lead|mc)'
    tag: "Strong Female Protagonist"
  - pattern: '(?:main\s+character|protagonist|protag|main\s+lead|lead|mc|hero)(?:\s+(?:is|being|should\s+be|must\s+be|would\s+be|has\s+to\s+be))?(?:\s+an?)?\s+(?:girl|woman|female|lady|gal)'
    tag: "Female Protagonist"
  - pattern: '(?:play(?:ing)?|playing)\s+as\s+(?:an?\s+)?(?:girl|woman|female|lady)'
    tag: "Female Protagonist"
  - pattern: '(?:girl|woman|female)\s+(?:main\s+character|protagonist|protag|lead|mc)'
    tag: "Female Protagonist"
  - pattern: '(?:main\s+character|protagonist|protag|main\s+lead|lead|mc)(?:\s+(?:is|being|should\s+be|must\s+be|would\s+be|has\s+to\s+be))?(?:\s+an?)?\s+(?:boy|man|male|guy)'
    tag: "Male Protagonist"
  - pattern: '(?:play(?:ing)?)\s+as\s+(?:an?\s+)?(?:boy|man|male|guy)'
    tag: "Male Protagonist"
  - pattern: '(?:boy|man|male|guy)\s+(?:main\s+character|protagonist|protag|lead|mc)'
    tag: "Male Protagonist"
  - pattern: '(?:lots\s+of|many|several|different|multiple)\s+(?:possible\s+)?(?:endings|outcomes)'
    tag: "Multiple Endings"
  # "1920s setting" is when the story happens, not when the game came out
  - pattern: '(?:set\s+in\s+(?:the\s+)?)?19[0-9]0''?s(?:\s+(?:or|and|to|-)\s+(?:the\s+)?19[0-9]0''?s)?\s+(?:setting|era|period|japan|america|london|paris|tokyo)|set\s+in\s+(?:the\s+)?19[0-9]0''?s'
    tag: "20th Century"
  - pattern: 'choices?\s+(?:that\s+)?(?:really\s+|actually\s+|truly\s+)?(?:matter|affect|change|decide)'
    tag: "Branching Plot"
  - pattern: '(?:reconnect\w*|reunit\w*)(?:\s+after\s+(?:many\s+|so\s+many\s+)?years(?:\s+apart)?)?|(?:after\s+)?(?:many\s+)?years\s+apart'
    tag: "Reunion"

  # stakes: "people can die", "choices affect who survives"
  - pattern: '(?:people|characters?|anyone|everyone|party\s+members?|heroines?|friends|you|mc|protagonist|protag|main\s+character)\s+(?:can|could|may|might|will)\s+(?:actually\s+|really\s+|permanently\s+)?die|who\s+(?:survives|lives|dies)|permadeath|perma-death'
    any_tags: ["Life and Death Drama", "Death of Heroine", "Death of Protagonist"]
  - pattern: 'low\s+stakes|stress[- ]free'
    exclude_tags: ["Life and Death Drama"]
  # "nothing bad happens": the negation splits off "nothing", so this side names the bad thing
  - pattern: '(?:bad|sad|terrible|tragic)\s+(?:stuff\s+|things\s+)?(?:ever\s+)?happens?(?:\s+to\s+(?:anyone|anybody|them|the\s+characters))?'
    tag: "Life and Death Drama"
  # "starts as rom com then gets real dark": the turn, not the starting genre
  - pattern: '(?:then|later|eventually|suddenly|but\s+then)\s+(?:gets?|turns?|becomes?|goes|takes\s+a)\s+(?:(?:real(?:ly)?|very|super|pretty|so|much|way)\s+)?(?:dark|sad|grim|twisted|serious|horror|disturbing)(?:\s+turn)?|genre\s+shift|tonal\s+shift|mood\s+whiplash|bait\s+and\s+switch'
    tag: "Genre Shift"
  - pattern: '(?:culprit|killer|murderer|answer|solution|truth)\s+(?:changes?|is\s+different|differs)\s+(?:per|each|every|by|in\s+each|depending\s+on\s+the)\s+route|different\s+(?:culprits?|killers?|solutions?)\s+(?:per|each|in\s+each|for\s+each)\s+route|(?:each|every)\s+route\s+reveals'
    tag: "Multiple Route Mystery"
  - pattern: 'locked\s+(?:behind|until|after)(?:\s+(?:other|all|the\s+other|every|finishing)(?:\s+\w+)?\s+routes?)?|unlock(?:s|ed)?\s+after\s+(?:other|all|the\s+other)\s+routes?'
    tag: "Unlockable Routes"
  - pattern: '(?:switch(?:es|ing)?|chang(?:es|ing)|shift(?:s|ing)?|alternat(?:es|ing)|multiple|different)\s+(?:between\s+)?(?:perspectives?|povs?|points?\s+of\s+view|narrators?)|(?:perspective|pov)\s+(?:switch|change|shift)(?:es|s|ing)?'
    tag: "Changing Perspective"
  - pattern: 'reliv(?:e|es|ing)\s+the\s+same\s+(?:day|week|days)|same\s+day\s+(?:over\s+and\s+over|again\s+and\s+again)|groundhog\s+day'
    tag: "Time Loop"
  - pattern: '(?:transported|summoned|reincarnated|sent|thrown|teleported|trapped|isekaied)\s+(?:in)?to\s+(?:an(?:other)?|a\s+different|a\s+fantasy|a\s+parallel|a\s+game)\s+world'
    tag: "Protagonist from a Different World"
    ln: "Isekai"
  - pattern: 'heroines?\s+(?:is|are|being)\s+older\s+than\s+(?:the\s+)?(?:mc|protagonist|protag|main\s+character|me|him|you|the\s+hero)|older\s+heroines?|heroines?\s+(?:who\s+(?:is|are)\s+)?older\s+than'
    tag: "Only Older Heroines"
  - pattern: '(?:(?:over|above)\s+)?[3-9]0\s*\+?\s*(?:years?\s+old\s+|yo\s+)?(?:heroines?|women|ladies)'
    tag: "Adult Heroine"
  - pattern: 'date\s+other\s+(?:women|girls)|(?:girls?|women)\s+(?:who\s+)?(?:dat(?:e|ing)|lov(?:e|ing))\s+(?:other\s+)?(?:girls?|women)'
    tag: "Girl x Girl Romance"
  - pattern: 'real\s+ending|proper\s+ending|actual\s+ending|(?:a\s+)?complete\s+story'
    exclude_tags: ["Cliffhanger Ending"]
  - pattern: 'skippable\s+(?:h|sex)(?:[- ]?scenes?)?|(?:h|sex)[- ]?scenes?\s+(?:are\s+|is\s+)?(?:skippable|optional)'
    tag: "In-game Sexual Content Toggle"

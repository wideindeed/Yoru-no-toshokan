# =====================================================================
#  Yoru no Toshokan — synonym dictionary  (edit freely)
# =====================================================================
#
# This file is checked FIRST for every phrase, before the built-in rules
# and before fuzzy tag matching. Keys are matched case-insensitively
# against the whole phrase (and its singular / filler-stripped forms), and
# are also offered to the fuzzy matcher, so small typos still hit them.
#
# Each entry maps a phrase to ONE OR MORE of these targets:
#
#   tag: "Tag Name"            # one VNDB tag (name or alias, as on vndb.org)
#   tag: ["Tag A", "Tag B"]    # several tags, ALL required
#   any_tags: ["A", "B"]       # several tags, ANY one is enough (OR)
#   exclude_tags: ["A", "B"]   # tags that must NOT be present
#   content: suggestive        # a content level defined below
#   engine: "RPG Maker"        # exact VNDB engine string (see docs/api_notes.md)
#   lang: en                   # VNDB language code(s), e.g. en / [en, ja]
#   platform: win              # VNDB platform code(s), e.g. win / [and, ios]
#   min_level: 2.0             # optional: stricter tag level for this entry (0-3)
#   ln: { ... }                # light novel mode (AniList): these targets replace
#                              # the ones above. AniList tag/genre names, see
#                              # data/anilist_tags.json. An entry with ONLY `ln:`
#                              # exists in light novel mode only.
#
# In light novel mode, VNDB names AniList doesn't have are skipped quietly;
# names that exist on both (Female Protagonist, Time Loop...) just work.
#
# Tag names are resolved to IDs at startup. If a name no longer exists on
# VNDB you get a warning in the console and that entry is skipped.
#
# A phrase prefixed with "no"/"without"/"not"/"exclude" is automatically
# negated, so you do NOT need separate "no X" entries — but you can add
# one when the negated meaning is special (see "no sexual content").
# =====================================================================


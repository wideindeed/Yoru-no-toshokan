# Builds the browser-only version (build_web.py) and publishes it to GitHub Pages.
# Enable once: repo Settings -> Pages -> Source: GitHub Actions.
name: Web version
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"        # weekly, to refresh the tag list
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python build_web.py   # downloads the VNDB (about 30 polite requests) and AniList tag lists
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
